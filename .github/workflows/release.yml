name: Release

# Fires only for pushes that land on main (i.e. a merge) -- there is no
# `pull_request:` trigger here on purpose, so PRs never run this workflow.
"on":
  push:
    branches: [main]

permissions:
  contents: write # needed to create the GitHub Release and upload assets

env:
  # Pinned deliberately: pywebview + PyInstaller had a real bundling bug on
  # Python 3.14 (very new at the time of writing) that force-including
  # hiddenimports works around locally, but there's no reason to risk that
  # combination again in CI. 3.11 is the best-supported target for both
  # PyInstaller and pyobjc/pywebview right now.
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            dist_path: dist/FramePalette.app
            asset_name: FramePalette-macOS.zip
          - os: windows-latest
            platform: windows
            dist_path: dist/FramePalette.exe
            asset_name: FramePalette-Windows.zip
          - os: ubuntu-latest
            platform: linux
            dist_path: dist/FramePalette
            asset_name: FramePalette-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux GTK/WebKit backend for pywebview
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean frame_palette_app.spec

      - name: Package build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent FramePalette.app "../${{ matrix.asset_name }}"

      - name: Package build (Windows)
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path "${{ matrix.dist_path }}" -DestinationPath "${{ matrix.asset_name }}"
        shell: pwsh

      - name: Package build (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod +x "${{ matrix.dist_path }}"
          tar -czf "${{ matrix.asset_name }}" -C dist "$(basename "${{ matrix.dist_path }}")"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine version and tag
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Frame Palette v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: release-assets/*
