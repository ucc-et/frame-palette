[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-palette"
version = "0.1.0"
description = "Turn a video into a stripe-poster of its average frame colors"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "Pillow",
  "fastapi",
  "uvicorn",
  "pywebview",
]

[project.scripts]
frame-palette-cli = "frame_palette.cli:main"
frame-palette = "main:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
]

[tool.setuptools]
packages = ["frame_palette"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
